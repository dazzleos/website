# Publishes the site to GitHub Pages (dazzleos.org). It runs when the site
# changes and every hour, to bring in the store's current apps
# (scripts/update-store).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the store's apps
        run: scripts/update-store
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html style.css app.js CNAME assets data _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
